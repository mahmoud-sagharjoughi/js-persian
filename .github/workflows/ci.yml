name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm pack --pack-destination "${{ runner.temp }}"
      - run: node test/package.js "${{ runner.temp }}" "${{ runner.temp }}/consumer" --check-syntax
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package
          path: ${{ runner.temp }}/persian-*.tgz
          if-no-files-found: error
          retention-days: 1

  runtime:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node:
          - '0.10.48'
          - '0.12.18'
          - '4.0.0'
          - '4.8.6'
          - '4.9.1'
          - '6.0.0'
          - '6.12.0'
          - '6.17.1'
          - '8.0.0'
          - '8.9.1'
          - '8.17.0'
          - '9.2.0'
          - '10.24.1'
          - '12.22.12'
          - '14.21.3'
          - '16.20.2'
          - '18.20.8'
          - '20.19.5'
          - '22.23.3'
          - '24.16.0'
          - '26.10.0'
        include:
          - { os: windows-latest, node: '22.23.3' }
          - { os: windows-latest, node: '24.16.0' }
          - { os: windows-latest, node: '26.10.0' }
          - { os: macos-latest, node: '22.23.3' }
          - { os: macos-latest, node: '24.16.0' }
          - { os: macos-latest, node: '26.10.0' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package
      - run: node test/package.js "${{ runner.temp }}/npm-package" "${{ runner.temp }}/consumer" --prepare-install
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node --version
      - run: npm --version
      - name: Install local npm archive
        working-directory: ${{ runner.temp }}/consumer
        env:
          npm_config_cache: ${{ runner.temp }}/npm-install-cache
          npm_config_userconfig: ${{ runner.temp }}/consumer/npmrc
          npm_config_registry: http://127.0.0.1:9
          npm_config_audit: 'false'
          npm_config_fund: 'false'
          npm_config_update_notifier: 'false'
        run: npm install ./persian.tgz --save
      - run: node "${{ runner.temp }}/consumer/installed.js"
      - run: node "${{ runner.temp }}/consumer/test.js"
      - run: node "${{ runner.temp }}/consumer/legacy-test.js"
      - run: node "${{ runner.temp }}/consumer/standalone.js" "${{ runner.temp }}/consumer"
      - run: node "${{ runner.temp }}/consumer/benchmark.js"
      - name: Native ESM imports
        if: ${{ !startsWith(matrix.node, '0.') && !startsWith(matrix.node, '4.') && !startsWith(matrix.node, '6.') && !startsWith(matrix.node, '8.') && !startsWith(matrix.node, '9.') && !startsWith(matrix.node, '10.') }}
        run: node "${{ runner.temp }}/consumer/test.mjs"

  types:
    name: TypeScript ${{ matrix.typescript }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { typescript: '2.6.2', node: '8.9.1', mode: legacy }
          - { typescript: '7.0.2', node: '24.16.0', mode: modern }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package
      - run: node test/package.js "${{ runner.temp }}/npm-package" "${{ runner.temp }}/consumer"
      - run: npm install --prefix "${{ runner.temp }}/compiler" --ignore-scripts --no-audit --no-fund --save-exact typescript@${{ matrix.typescript }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node test/types.js "${{ runner.temp }}/compiler/node_modules/typescript/bin/tsc" "${{ runner.temp }}/consumer" ${{ matrix.mode }}

  browser:
    name: Browser / ${{ matrix.browser }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package
      - run: node test/package.js "${{ runner.temp }}/npm-package" "${{ runner.temp }}/consumer" --prepare-install
      - name: Install local npm archive
        working-directory: ${{ runner.temp }}/consumer
        env:
          npm_config_cache: ${{ runner.temp }}/npm-install-cache
          npm_config_userconfig: ${{ runner.temp }}/consumer/npmrc
          npm_config_registry: http://127.0.0.1:9
          npm_config_audit: 'false'
          npm_config_fund: 'false'
          npm_config_update_notifier: 'false'
        run: npm install ./persian.tgz --save
      - run: node "${{ runner.temp }}/consumer/installed.js"
      - run: npm ci --prefix test/browser --ignore-scripts --no-audit --no-fund
      - run: node test/browser/node_modules/playwright/cli.js install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser -- "${{ runner.temp }}/consumer" ${{ matrix.browser }}

  yarn:
    name: Yarn ${{ matrix.yarn }} / ${{ matrix.mode }} / Node ${{ matrix.node }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { yarn: '1.3.2', package: yarn, node: '8.9.1', mode: classic }
          - { yarn: '1.22.22', package: yarn, node: '24.16.0', mode: classic }
          - { yarn: '4.18.1', package: '@yarnpkg/cli-dist', node: '24.16.0', mode: node-modules }
          - { yarn: '4.18.1', package: '@yarnpkg/cli-dist', node: '24.16.0', mode: pnp }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package
      - run: node test/package.js "${{ runner.temp }}/npm-package" "${{ runner.temp }}/consumer" --prepare-install
      - run: npm install --prefix "${{ runner.temp }}/yarn-cli" --ignore-scripts --no-audit --no-fund --save-exact ${{ matrix.package }}@${{ matrix.yarn }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node test/yarn.js "${{ runner.temp }}/yarn-cli/node_modules/${{ matrix.package }}/bin/yarn.js" "${{ runner.temp }}/consumer" ${{ matrix.mode }}
